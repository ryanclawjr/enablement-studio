# Tablework public host. Same generate()+HTML as `enablement serve`.
# Python Worker entry: src/worker.py (Pyodide). http.server / threading
# are not used on the public host.
#
# TARGET: the existing Cloudflare project named enablement-studio.
# Static Pages cannot run generate(); Harborline POST is 405 there.
# This file is a Worker + Static Assets config so fetch() is on the
# public host. Same name. One project. Do not invent a second name.
# Prefer https://enablement-studio.pages.dev if that hostname still
# points at this project after convert. No custom domain.
#
# wrangler 4.85.0 treats pages_build_output_dir as Pages and then
# rejects `main`, `[assets]`, `[[rules]]`, `[[migrations]]`, and a
# Durable Object without script_name. It also reserves ASSETS.
# Do not put pages_build_output_dir back.
#
# SessionVault is a same-script Durable Object (es_sid, 1h TTL).
# Optional KV (same isolation). Create with:
#   npx wrangler kv namespace create SESSIONS
# then uncomment and paste the id. The Worker prefers SESSIONS when bound.
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "paste-id-here"
#
# Production deploy from a Cloudflare-authenticated Air (uv + Node):
#   uvx --from workers-py pywrangler deploy
# After `pip install -e ".[cloudflare]"` / `uv add --optional cloudflare`:
#   uv run pywrangler deploy
#
# Do not upload static-only after this. Do not deploy a second name.
# Do not put ENABLEMENT_LLM_API_KEY in this file.
#
# Optional LLM (offline Run works without it):
#   npx wrangler secret put ENABLEMENT_LLM_API_KEY
# Do not read ~/.enablement_llm.env.

name = "enablement-studio"
main = "src/worker.py"
compatibility_date = "2026-08-21"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "STATIC"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionVault"]

[[rules]]
type = "Data"
globs = ["**/*.sql", "**/*.html", "**/*.txt", "**/*.md", "**/*.woff", "**/*.woff2"]
fallthrough = true
