# Tablework public host. Same generate()+HTML as `enablement serve`.
# Python Worker (Pyodide). http.server / threading are not used here.
#
# Deploy from a Cloudflare-authenticated Air (uv + Node):
#   uvx --from workers-py pywrangler deploy
# After `uv add --optional cloudflare` / `pip install -e ".[cloudflare]"`:
#   uv run pywrangler deploy
#
# Preferred public URL (Pages project, same family as autonoma-intelligence):
#   https://enablement-studio.pages.dev
# Create that project once in the dashboard and attach this Worker.
# Immediate Workers URL: https://enablement-studio.<subdomain>.workers.dev
# No custom domain.
#
# Optional LLM (do not set in this sitting; offline Run works without it):
#   npx wrangler secret put ENABLEMENT_LLM_API_KEY
# Do not put the key in this file. Do not read ~/.enablement_llm.env.
#
# Optional Autonoma-family KV (same isolation as SessionVault). Create with:
#   npx wrangler kv namespace create SESSIONS
# then uncomment and paste the id. The Worker prefers SESSIONS when bound.
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "paste-id-here"

name = "enablement-studio"
main = "src/worker.py"
compatibility_date = "2026-08-21"
compatibility_flags = ["python_workers"]
workers_dev = true

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionVault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionVault"]

[assets]
directory = "src/enablement_studio/static"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[rules]]
type = "Data"
globs = ["**/*.sql", "**/*.html", "**/*.txt", "**/*.md", "**/*.woff", "**/*.woff2"]
fallthrough = true
