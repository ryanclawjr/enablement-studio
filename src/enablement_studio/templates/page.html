<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}} — Tablework</title>
  <style>
    :root {
      color-scheme: dark;
      --chrome: #16161D;
      --table: #0B0B0E;
      --card: #1C1C22;
      --card-lift: #22222A;
      --canvas: var(--chrome);
      --surface: var(--card);
      --surface-lift: var(--card-lift);
      --hairline: #2A2A33;
      --hairline-subtle: #24242C;
      --ink: #F5F5F4;
      --muted: #8A8A90;
      --accent: #FFE52F;
      --accent-hover: #FFE52F;
      --accent-ink: #000000;
      --accent-tint: rgba(255, 229, 47, 0.16);
      --danger: #ff6b5a;
      --danger-surface: #2a1512;
      --danger-border: #5a2a24;
      --radius-card: 24px;
      --shadow-sm: 0 1px 0 rgba(0, 0, 0, 0.4);
      --ease: 250ms ease;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--chrome);
      -webkit-font-smoothing: antialiased;
    }
    header.app-header {
      padding: 0.55rem 1.25rem 0;
    }
    .chrome {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    h1, .wordmark {
      font-size: 21px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .wordmark a {
      color: inherit;
      text-decoration: none;
    }
    .status-pill {
      margin: 0;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
    }
    .next-line {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }
    .next-line a {
      color: inherit;
      text-decoration: none;
      transition: color var(--ease);
    }
    .next-line a:hover {
      color: var(--ink);
    }
    .role-path {
      display: inline-flex;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
      margin: 0.55rem 0 0;
    }
    .path-step {
      display: inline-flex;
      align-items: center;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: background-color var(--ease), color var(--ease), transform var(--ease);
    }
    .path-step:hover {
      color: var(--ink);
      transform: translateY(-1px);
    }
    .path-step.current {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }
    .path-step.current:hover {
      filter: brightness(1.06);
    }
    .path-step.past {
      color: var(--ink);
    }
    .path-step.future {
      opacity: 0.45;
    }
    .notice {
      margin: 0.45rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .studio {
      display: grid;
      grid-template-columns: minmax(0, 42rem) 12.5rem;
      gap: 1.75rem;
      align-items: start;
      padding: 0.75rem 1.25rem 3rem;
    }
    body.comparing .studio {
      grid-template-columns: minmax(0, 1fr) 12.5rem;
      max-width: 82rem;
    }
    @media (max-width: 720px) {
      .studio { grid-template-columns: 1fr; }
    }
    .table {
      min-width: 0;
      background-color: var(--table);
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 1.1rem 1.15rem 1.25rem;
    }
    .source-strip {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 0.65rem 0.85rem;
      margin: 0 0 0.75rem;
      transition: transform var(--ease), border-color var(--ease), background-color var(--ease);
    }
    .source-strip:hover {
      transform: translateY(-1px);
      border-color: #3A3A44;
      background: var(--card-lift);
    }
    .source-strip summary {
      cursor: pointer;
      list-style: none;
    }
    .source-strip summary::-webkit-details-marker { display: none; }
    .source-strip-title {
      font-weight: 600;
      color: var(--ink);
    }
    .source-strip-preview {
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      white-space: pre-wrap;
      margin: 0.35rem 0 0;
      max-height: 4.2rem;
      overflow: hidden;
    }
    .source-strip textarea {
      min-height: 10rem;
      margin-top: 0.65rem;
    }
    .step-view h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
    }
    .step-source .board {
      max-width: 42rem;
    }
    .step-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--hairline);
    }
    a.btn-action.continue {
      color: var(--accent-ink);
      background: var(--accent);
    }
    a.btn-action.continue:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }
    a.btn-action.back, a.btn-action.versions-link {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
    }
    a.btn-action.back:hover, a.btn-action.versions-link:hover {
      background: var(--surface-lift);
      transform: translateY(-1px);
    }
    
    /* Surfaces */
    .board {
      background: transparent;
      border: 0;
      padding: 0;
    }
    .compare {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
    }
    
    label.stack {
      display: block;
      margin: 0 0 0.75rem;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    input[type="text"], textarea, select {
      display: block;
      width: 100%;
      margin-top: 0.3rem;
      padding: 0.45rem 0.55rem;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--table);
      transition: border-color var(--ease), box-shadow var(--ease);
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #3A3A44;
      box-shadow: 0 0 0 2px var(--accent-tint);
    }
    textarea {
      min-height: 16rem;
      resize: vertical;
      font-family: inherit;
      line-height: 1.45;
      border-radius: 16px;
      padding: 0.85rem 1rem;
      background: var(--table);
    }
    
    /* Source collapsed state after run */
    details.source-details {
      margin-top: 0.3rem;
    }
    details.source-details summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
      margin-bottom: 0.35rem;
    }
    details.source-details summary:hover {
      color: var(--ink);
    }
    .source-preview-box {
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.45rem 0.55rem;
      background: var(--canvas);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      max-height: 4.8rem;
      overflow: hidden;
      margin-bottom: 0.4rem;
      white-space: pre-wrap;
    }
    
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.6rem;
    }
    
    /* Buttons */
    button.run, .compare-form button, button.llm, a.btn-action {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 1.05rem;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background-color var(--ease), color var(--ease), transform var(--ease), box-shadow var(--ease), border-color var(--ease);
      text-decoration: none;
    }
    button.run, .compare-form button {
      color: var(--accent-ink);
      background: var(--accent);
    }
    button.run:hover, .compare-form button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }
    button.run:focus, .compare-form button:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--accent);
    }
    
    /* Ghost LLM button */
    button.llm {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--hairline);
      font-weight: 500;
    }
    button.llm:hover {
      background: var(--surface-lift);
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }
    button.llm:disabled {
      color: var(--muted);
      opacity: 0.6;
      cursor: not-allowed;
    }
    .no-key-caption {
      font-size: 11px;
      color: var(--muted);
      font-weight: normal;
    }
    
    .hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      margin: 0.5rem 0 0;
    }
    .harborline {
      margin: 0.65rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    button.text-action {
      appearance: none;
      border: 0;
      padding: 0;
      background: none;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: color var(--ease);
    }
    button.text-action:hover {
      color: var(--ink);
    }
    .demos {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--hairline);
    }
    .demos a {
      color: var(--accent);
      text-decoration: none;
      margin-right: 0.5rem;
    }
    .demos a:hover {
      text-decoration: underline;
    }
    
    /* Board sits on the canvas; objects are the page */
    
    .error {
      background: var(--danger-surface);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      margin: 0 0 1rem;
      color: var(--danger);
      font-size: 12px;
      font-weight: 500;
    }
    
    /* Empty board */
    .empty-board {
      padding: 2rem 1.5rem;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--hairline);
    }
    .empty-board p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 13px;
    }
    .empty-frames {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.65rem;
      margin: 1.25rem 0;
      opacity: 0.45;
    }
    .empty-frame-box {
      border: 1px dashed var(--hairline);
      border-radius: 6px;
      padding: 1rem 0.5rem;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    /* Result article */
    .result {
      border: 0;
      padding: 0;
    }
    
    .module-header {
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--hairline);
    }
    .module-header h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 0.4rem;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    
    /* Single metadata row */
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--ink);
    }
    .meta-chip-label {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    
    .source-note-banner {
      font-size: 11px;
      color: var(--muted);
      margin: 0.4rem 0 0;
    }
    
    /* Failed / Invalid */
    .studio-failed {
      border-left: 3px solid var(--danger);
      padding-left: 0.85rem;
    }
    .studio-failed h2 {
      color: var(--danger);
    }
    .invalid-banner {
      background: var(--danger-surface);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      margin: 0.75rem 0 1rem;
      color: var(--danger);
    }
    .invalid-banner strong {
      font-weight: 600;
    }
    .invalid-reasons {
      margin: 0.4rem 0 0;
      padding-left: 1.15rem;
      font-size: 12px;
      color: var(--danger);
    }
    .failed-artifacts {
      opacity: 0.65;
    }
    
    /* Stacked Objects */
    .object {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 0.95rem 1.1rem 1.1rem;
      margin: 0 0 0.85rem;
      transition: transform var(--ease), border-color var(--ease), background-color var(--ease);
    }
    .object:hover {
      transform: translateY(-2px);
      border-color: #3A3A44;
      background: var(--card-lift);
    }
    .object h3 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 0.65rem;
      color: var(--ink);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .object-tag {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--muted);
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.1rem 0.45rem;
    }
    
    /* Graph SVG & nodes */
    .skill-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--hairline-subtle);
    }
    .skill-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      font-size: 12px;
    }
    .skill-chip strong {
      font-weight: 600;
      color: var(--ink);
    }
    .graph-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .graph-node-row {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--hairline-subtle);
    }
    .graph-node-row:last-child {
      border-bottom: none;
    }
    .graph-node-head {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }
    .graph-node-name {
      font-weight: 600;
      color: var(--ink);
    }
    .graph-node-detail {
      margin: 0.2rem 0 0.3rem;
      font-size: 12px;
      color: var(--muted);
    }
    .graph-adj-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .adj-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      padding: 0.1rem 0.35rem;
    }
    
    /* Clean captions / mono: L2 · 6 min (NO green pills) */
    .mono-caption {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      font-weight: normal;
    }
    
    /* Objectives */
    .objectives-list {
      padding-left: 1.25rem;
      margin: 0;
    }
    .objectives-list li {
      margin-bottom: 0.55rem;
      line-height: 1.45;
    }
    .objectives-list li:last-child {
      margin-bottom: 0;
    }
    .obj-statement {
      color: var(--ink);
    }
    .obj-measure {
      margin: 0.2rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    
    /* Timeline Outline */
    .timeline {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .timeline-item {
      display: grid;
      grid-template-columns: 4rem 1fr;
      gap: 0.75rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid var(--hairline-subtle);
      align-items: baseline;
    }
    .timeline-item:last-child {
      border-bottom: none;
    }
    .timeline-time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .timeline-content strong {
      font-weight: 600;
      color: var(--ink);
    }
    .timeline-content p {
      margin: 0.15rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    
    /* Gong-style Practice Scenario Card */
    .scenario-card {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .scenario-section {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .scenario-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .scenario-text {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      color: var(--ink);
    }
    .practice-steps, .practice-success {
      padding-left: 1.15rem;
      margin: 0;
      font-size: 12px;
      color: var(--ink);
      line-height: 1.4;
    }
    .practice-steps li, .practice-success li {
      margin-bottom: 0.2rem;
    }
    .practice-success {
      color: var(--muted);
    }
    
    /* Quiz */
    .quiz-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .quiz-item {
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--hairline-subtle);
    }
    .quiz-item:last-child {
      border-bottom: none;
    }
    .quiz-prompt {
      font-weight: 500;
      margin: 0 0 0.45rem;
      color: var(--ink);
    }
    .quiz-choices {
      list-style: none;
      padding: 0;
      margin: 0 0 0.45rem;
    }
    .quiz-choices li {
      padding: 0.2rem 0.5rem;
      margin-bottom: 0.2rem;
      font-size: 12px;
      border-radius: 4px;
      color: var(--ink);
    }
    .quiz-choices li.answer {
      font-weight: 600;
      background: var(--canvas);
    }
    
    /* Quiz details collapsed */
    details.quiz-details {
      margin-top: 0.35rem;
    }
    details.quiz-details summary {
      cursor: pointer;
      font-size: 11px;
      color: var(--muted);
      user-select: none;
    }
    details.quiz-details summary:hover {
      color: var(--ink);
    }
    .quiz-details-content {
      margin-top: 0.3rem;
      padding: 0.45rem 0.65rem;
      background: var(--canvas);
      border-radius: 4px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    
    /* Call & Critic styles */
    .coaching-notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }
    .note-card {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
    }
    .note-audience {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .note-headline {
      font-weight: 600;
      font-size: 12px;
      color: var(--ink);
      margin-bottom: 0.2rem;
    }
    .note-body {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    
    .scores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }
    .score-card {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      text-align: center;
    }
    .score-num {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      font-family: var(--font-mono);
    }
    .score-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    
    /* Versions rail */
    .versions {
      min-width: 0;
      padding: 0.15rem 0 0;
    }
    .versions h2 {
      font-size: 12px;
      font-weight: 500;
      margin: 0 0 0.45rem;
      color: var(--muted);
    }
    .runs {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .runs li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.35rem 0.45rem;
      margin-bottom: 0.2rem;
      border-radius: 4px;
      font-size: 12px;
    }
    .runs li:hover {
      background: var(--canvas);
    }
    .runs a.run-link {
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: baseline;
      gap: 0.45rem;
      flex-grow: 1;
    }
    .run-version-tag {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--ink);
    }
    .run-version-tag.current-version {
      color: var(--accent);
    }
    .invalid-chip {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--danger-surface);
      color: var(--danger);
      border: 1px solid var(--danger-border);
      border-radius: 3px;
      padding: 0.05rem 0.3rem;
    }
    .compare-btn {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--hairline);
      background: var(--surface);
    }
    .compare-btn:hover {
      color: var(--ink);
      border-color: var(--muted);
    }
    
    /* Compare column docked */
    .compare {
      margin-top: 1.25rem;
      padding: 1rem 1.15rem;
    }
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 900px) {
      .compare-grid { grid-template-columns: 1fr; }
    }
    .compare-col {
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.85rem;
      background: var(--surface);
    }
    .compare-col-head {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.65rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--hairline);
    }
  </style>
</head>
<body class="{{body_class}}">
  <header class="app-header">
    <div class="chrome">
      <h1 class="wordmark"><a href="/">Tablework</a></h1>
      <p class="status-pill">this machine · 127.0.0.1 · offline</p>
      <nav class="next-line" aria-label="Next products">
        <a href="/?next=call">Call Next</a>
        ·
        <a href="/?next=critic">Critic Next</a>
      </nav>
    </div>
    {{path_chrome}}
    {{notice_block}}
  </header>
  <div class="studio">
    <div class="table">
      {{source_strip}}
      <section class="board">
        {{error_block}}
        {{step_board}}
        {{compare_block}}
        {{step_nav}}
      </section>
    </div>
    <aside class="versions" id="versions">
      <h2>{{runs_heading}}</h2>
      {{runs_block}}
    </aside>
  </div>
</body>
</html>
