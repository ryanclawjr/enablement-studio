<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enablement Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1916;
      --muted: #5c564d;
      --paper: #f4f0e7;
      --card: #fffdf8;
      --line: #d7d0c3;
      --accent: #1b1916;
      --warn: #efe3b0;
      --bad: #f3d4ce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 42rem;
      padding: 1.25rem 1rem 3rem;
      font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    h1, h2, h3 { line-height: 1.2; }
    h1 { font-size: 1.45rem; margin: 0 0 0.35rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.6rem; }
    h3 { font-size: 1rem; margin: 1.1rem 0 0.4rem; }
    header p, .hint { color: var(--muted); }
    form, .result, .runs {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem;
    }
    fieldset {
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 0 0 0.85rem;
      padding: 0.6rem 0.75rem;
    }
    .products { display: flex; flex-wrap: wrap; gap: 0.65rem 1rem; }
    label.stack { display: block; margin: 0 0 0.85rem; }
    input[type="text"], textarea {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.5rem 0.55rem;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    textarea { min-height: 14rem; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    button.run {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 0.95rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
    }
    .demos { margin: 0.85rem 0 0; }
    .demos a { margin-right: 0.75rem; }
    .error, .banner, .invalid {
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      margin: 0 0 0.85rem;
    }
    .error, .invalid { background: var(--bad); }
    .banner { background: var(--warn); }
    .meta { color: var(--muted); font-size: 0.92rem; }
    .result ul { padding-left: 1.15rem; }
    .runs { list-style: none; margin: 0; }
    .runs li { margin: 0 0 0.45rem; }
    .runs a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>Enablement Studio</h1>
    <p>Local UI on this machine. Same <code>generate()</code> path and SQLite store as the CLI. No login. No API key required.</p>
  </header>

  <h2>Run a product</h2>
  <form method="post" action="/">
    <fieldset>
      <legend>Product</legend>
      <div class="products">
        <label><input type="radio" name="product" value="role" {{role_checked}}> Role → Enablement</label>
        <label><input type="radio" name="product" value="call" {{call_checked}}> Call → Coach</label>
        <label><input type="radio" name="product" value="critic" {{critic_checked}}> Lesson critic</label>
      </div>
    </fieldset>
    <label class="stack">Project
      <input type="text" name="project" value="{{project}}" autocomplete="off">
    </label>
    <label class="stack">Job, SOP, transcript, or outline
      <textarea name="text" spellcheck="false">{{text}}</textarea>
    </label>
    <div class="actions">
      <button class="run" type="submit">Run</button>
    </div>
    <p class="demos hint">Load demo (EXAMPLE DATA fixtures, not a live employer):
      <a href="/?product=role&amp;demo=1">Role</a>
      <a href="/?product=call&amp;demo=1">Call</a>
      <a href="/?product=critic&amp;demo=1">Critic</a>
    </p>
  </form>

  {{error_block}}
  {{result_block}}

  <h2>Recent runs</h2>
  {{runs_block}}
</body>
</html>
