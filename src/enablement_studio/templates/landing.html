<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablework</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f4f2;
      --surface: #ffffff;
      --hairline: #e4e2dc;
      --ink: #1a1916;
      --muted: #6b6860;
      --accent: #3d5a80;
      --shadow-sm: 0 1px 2px rgba(26, 25, 22, 0.04);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--canvas);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 34rem;
      margin: 0 auto;
      padding: 3.25rem 1.25rem 3.5rem;
    }
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 21px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .caption {
      font-size: 12px;
      color: var(--muted);
      margin: 0.2rem 0 0;
    }
    .status-badge {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 0.15rem 0.45rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    .sentence {
      margin: 0 0 1.35rem;
      color: var(--muted);
    }
    .doors {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .door {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .door strong {
      font-weight: 600;
    }
    .door-desc {
      font-size: 12px;
      color: var(--muted);
    }
    .door.primary {
      border-color: var(--accent);
    }
    .door.next {
      opacity: 0.55;
    }
    .notice {
      margin: 1rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body class="landing">
  <div class="wrap">
    <header class="top-bar">
      <div>
        <h1>Tablework</h1>
        <p class="caption">this machine · 127.0.0.1</p>
      </div>
      <span class="status-badge"><span class="status-dot"></span> this machine · 127.0.0.1 · offline</span>
    </header>
    <p class="sentence">Paste a job or SOP, walk a module from that source.</p>
    <nav class="doors" aria-label="Products">
      <a class="door primary" href="/role">
        <strong>Role</strong>
        <span class="door-desc">job → skill graph → 30-minute module</span>
      </a>
      <a class="door next" href="/call">
        <strong>Call</strong>
        <span class="door-desc">Next</span>
      </a>
      <a class="door next" href="/critic">
        <strong>Critic</strong>
        <span class="door-desc">Next</span>
      </a>
    </nav>
    {{notice_block}}
  </div>
</body>
</html>
