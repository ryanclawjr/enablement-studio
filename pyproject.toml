[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enablement-studio"
version = "0.1.0"
description = "Local-first agentic instructional design: Role → Enablement, Call → Coach, Lesson critic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ryan Johnson" }]
keywords = ["instructional-design", "enablement", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
enablement = "enablement_studio.cli:main"

[project.urls]
Repository = "https://github.com/ryanclawjr/enablement-studio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enablement_studio = ["py.typed", "store/schema.sql", "fixtures/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
