<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Role — Tablework</title>
  <style>
    @font-face {
      font-family: "Instrument Sans";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/static/fonts/instrument-sans-latin-400-normal.woff") format("woff");
    }
    @font-face {
      font-family: "Instrument Sans";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("/static/fonts/instrument-sans-latin-500-normal.woff") format("woff");
    }
    :root {
      color-scheme: dark;
      --black-brand: #16161d;
      --black-2: #1d1d25;
      --yellow-brand: #ffe52f;
      --white-brand: #f6f6f6;
      --heading: #ededed;
      --slate-grey: #757575;
      --status-fill: #191a1d;
      --hairline: rgba(236, 236, 236, 0.08);
      --hairline-strong: rgba(109, 112, 130, 0.21);
      --status-line: rgba(255, 255, 255, 0.15);
      --grid-stroke: rgba(132, 132, 132, 0.25);
      --canvas: var(--black-brand);
      --card: var(--black-2);
      --inset: #16161d;
      --ink: var(--white-brand);
      --muted: var(--slate-grey);
      --accent: var(--yellow-brand);
      --accent-ink: #000;
      --danger: #ff6b5a;
      --danger-surface: #2a1512;
      --danger-border: #5a2a24;
      --font-ui: "Instrument Sans", ui-sans-serif, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: var(--ink);
      background-color: var(--canvas);
      background-image:
        linear-gradient(to right, var(--grid-stroke) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-stroke) 1px, transparent 1px);
      background-size: 80px 80px;
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    header.app-header {
      flex: 0 0 auto;
      padding: 14px 20px 0;
    }
    .chrome {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h1, .wordmark {
      font-family: var(--font-ui);
      font-size: 22px;
      font-weight: 500;
      margin: 0;
      letter-spacing: -2px;
      color: var(--heading);
    }
    .wordmark a {
      color: inherit;
      text-decoration: none;
    }
    .status-pill {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      line-height: 18px;
      color: var(--white-brand);
      background: var(--status-fill);
      border: 1px solid var(--status-line);
      border-radius: 100vw;
      padding: 6px 14px;
    }
    .next-line {
      margin-left: auto;
      font-size: 12px;
      font-weight: 400;
      line-height: 18px;
      color: var(--white-brand);
    }
    .next-line a {
      color: inherit;
      text-decoration: none;
    }
    .next-line a:hover { color: var(--ink); }
    .notice {
      margin: 0.45rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    main.stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      padding: 12px 12px 20px;
    }
    table.object-table {
      width: min(68rem, calc(100vw - 24px));
      margin: 0;
      border-collapse: collapse;
      table-layout: fixed;
      background: transparent;
    }
    table.object-table thead th {
      padding: 0;
      font-weight: 400;
      vertical-align: bottom;
    }
    .object-cell {
      display: block;
      min-height: 2.75rem;
      padding: 8px 10px 10px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--hairline);
      border-bottom: 0;
      background: var(--card);
      transition: background 220ms ease, color 220ms ease;
    }
    .object-cell + .object-cell,
    th + th .object-cell {
      border-left-width: 0;
    }
    th:first-child .object-cell { border-radius: 10px 0 0 0; }
    th:last-child .object-cell { border-radius: 0 10px 0 0; }
    .object-name {
      display: block;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--heading);
    }
    .object-brief {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      line-height: 14px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .object-cell.current {
      background: var(--accent);
      color: var(--accent-ink);
      animation: current-object 280ms ease;
    }
    .object-cell.current .object-name,
    .object-cell.current .object-brief {
      color: var(--accent-ink);
    }
    @keyframes current-object {
      from { opacity: 0.55; }
      to { opacity: 1; }
    }
    table.object-table td {
      padding: 0;
      vertical-align: top;
    }
    .object-sheet {
      background: var(--card);
      border: 1px solid var(--hairline);
      padding: 20px 22px 16px;
      max-height: calc(100vh - 8.75rem);
      overflow: auto;
    }
    body.comparing .object-sheet {
      max-height: none;
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 16px 18px;
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      color: var(--ink);
      background: var(--inset);
      border: 1px solid var(--hairline);
      border-radius: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--hairline-strong);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
      margin-top: 14px;
    }
    button.run, button.example, button.llm, .compare-form button, a.btn-action {
      appearance: none;
      border: 0;
      border-radius: 100vw;
      padding: 8px 24px;
      min-height: 40px;
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
    }
    button.run, .compare-form button, a.btn-action.continue {
      color: var(--accent-ink);
      background: var(--accent);
    }
    button.example {
      color: var(--accent-ink);
      background: var(--accent);
    }
    button.example .example-tag {
      font-size: 11px;
      letter-spacing: 0.04em;
      opacity: 0.72;
    }
    button.llm {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--slate-grey);
    }
    button.llm:disabled {
      color: var(--muted);
      cursor: not-allowed;
    }
    .sheet-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 0 0;
      min-height: 24px;
    }
    .version-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }
    .version-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      text-decoration: none;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--hairline-strong);
    }
    .version-dot.current {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .step-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--hairline);
    }
    a.btn-action.back, a.btn-action.versions-link {
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--slate-grey);
    }
    .error {
      background: var(--danger-surface);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      margin: 0 0 1rem;
      color: var(--danger);
      font-size: 12px;
      font-weight: 500;
    }
    .result { border: 0; padding: 0; }
    .module-header {
      margin-bottom: 1.1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--hairline);
    }
    .module-header h2 {
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 0.4rem;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-chip-label {
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 10px;
    }
    .source-note-banner {
      font-size: 11px;
      color: var(--muted);
      margin: 0.4rem 0 0;
    }
    .studio-failed {
      border-left: 3px solid var(--danger);
      padding-left: 0.85rem;
    }
    .studio-failed h2 { color: var(--danger); }
    .invalid-banner {
      background: var(--danger-surface);
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      margin: 0.75rem 0 1rem;
      color: var(--danger);
    }
    .invalid-reasons {
      margin: 0.4rem 0 0;
      padding-left: 1.15rem;
      font-size: 12px;
    }
    .failed-artifacts { opacity: 0.65; }
    .object h3 {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 0.65rem;
      color: var(--ink);
    }
    .object-tag {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0.1rem 0.45rem;
      margin-left: 0.5rem;
    }
    .object.is-empty h3 {
      color: var(--muted);
    }
    .graph-stage {
      position: relative;
      max-width: 100%;
      overflow: auto;
      margin: 0 0 0.25rem;
    }
    body.step-graph .skill-graph {
      animation: graph-reveal 320ms ease;
    }
    @keyframes graph-reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .graph-svg {
      display: block;
    }
    .graph-nodes {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .graph-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      padding: 8px 10px;
      background: var(--inset);
      border: 1px solid var(--hairline-strong);
      border-radius: 8px;
    }
    .graph-node strong {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mono-caption {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      font-weight: normal;
    }
    .objectives-list {
      padding-left: 1.25rem;
      margin: 0;
    }
    .objectives-list li {
      margin-bottom: 0.55rem;
      line-height: 1.45;
    }
    .obj-measure {
      margin: 0.2rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .timeline { list-style: none; padding: 0; margin: 0; }
    .timeline-item {
      display: grid;
      grid-template-columns: 4rem 1fr;
      gap: 0.75rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid var(--hairline);
      align-items: baseline;
    }
    .timeline-item:last-child { border-bottom: none; }
    .timeline-time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .timeline-content strong { font-weight: 500; }
    .timeline-content p {
      margin: 0.15rem 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .scenario-card {
      background: var(--inset);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .scenario-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .scenario-text {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
    }
    .practice-steps, .practice-success {
      padding-left: 1.15rem;
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
    }
    .practice-success { color: var(--muted); }
    .quiz-list { list-style: none; padding: 0; margin: 0; }
    .quiz-item {
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--hairline);
    }
    .quiz-item:last-child { border-bottom: none; }
    .quiz-prompt {
      font-weight: 500;
      margin: 0 0 0.45rem;
    }
    .quiz-choices {
      list-style: none;
      padding: 0;
      margin: 0 0 0.45rem;
    }
    .quiz-choices li {
      padding: 0.2rem 0.5rem;
      margin-bottom: 0.2rem;
      font-size: 12px;
      border-radius: 4px;
    }
    .quiz-choices li.answer {
      font-weight: 500;
      background: var(--inset);
    }
    details.quiz-details { margin-top: 0.35rem; }
    details.quiz-details summary {
      cursor: pointer;
      font-size: 11px;
      color: var(--muted);
    }
    .quiz-details-content {
      margin-top: 0.3rem;
      padding: 0.45rem 0.65rem;
      background: var(--inset);
      border-radius: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .coaching-notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }
    .note-card {
      background: var(--inset);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
    }
    .note-audience {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .note-headline { font-weight: 500; font-size: 12px; }
    .note-body { font-size: 12px; color: var(--muted); }
    .scores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.65rem;
    }
    .score-card {
      background: var(--inset);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      text-align: center;
    }
    .score-num {
      font-size: 20px;
      font-weight: 500;
      font-family: var(--font-mono);
    }
    .score-label { font-size: 11px; color: var(--muted); }
    .hint {
      color: var(--muted);
      font-size: 11px;
      margin: 0.5rem 0 0;
    }
    .compare { margin-top: 0.25rem; }
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 900px) {
      .compare-grid { grid-template-columns: 1fr; }
      .object-brief { display: none; }
    }
    .compare-col {
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 0.85rem;
      background: var(--inset);
    }
    .compare-col-head {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.65rem;
    }
  </style>
</head>
<body class="product-role step-source public">
  <header class="app-header">
    <div class="chrome">
      <h1 class="wordmark"><a href="/">Tablework</a></h1>
      
      <nav class="next-line" aria-label="Next products">
        <a href="/?next=call">Call Next</a>
        ·
        <a href="/?next=critic">Critic Next</a>
      </nav>
    </div>
    
  </header>
  <main class="stage">
    <table class="object-table" aria-label="Role path">
      <thead>
        <tr><th scope="col"><a class="object-cell current" href="/role?step=source" aria-current="step"><span class="object-name">Source</span></a></th><th scope="col"><a class="object-cell future" href="/role?step=graph"><span class="object-name">Graph</span></a></th><th scope="col"><a class="object-cell future" href="/role?step=objectives"><span class="object-name">Objectives</span></a></th><th scope="col"><a class="object-cell future" href="/role?step=outline"><span class="object-name">Outline</span></a></th><th scope="col"><a class="object-cell future" href="/role?step=practice"><span class="object-name">Practice</span></a></th><th scope="col"><a class="object-cell future" href="/role?step=quiz"><span class="object-name">Quiz</span></a></th></tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6">
            <div class="object-sheet">
              
              <div class="step-view" data-step="source"><form method="post" action="/" class="role-form"><input type="hidden" name="product" value="role"><input type="hidden" name="project" value="default" autocomplete="off"><textarea name="text" spellcheck="false" aria-label="Job, SOP, or policy" placeholder="Paste a job or SOP..."></textarea><div class="actions"><button class="run" type="submit" name="action" value="run">Run</button><button class="example" type="submit" name="action" value="demo">Harborline <span class="example-tag">EXAMPLE DATA</span></button></div></form></div>
              
              
              <footer class="sheet-footer">
                <nav class="version-dots" id="versions" aria-label="Versions"></nav>
              </footer>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
